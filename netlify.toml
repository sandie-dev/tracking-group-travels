[build]
  command = "echo Building Travel Tracker"
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["express", "pg", "ejs"]

[functions."api"]
  included_files = ["views/**"]
# Send the app's dynamic pages through the Express Netlify Function.
[[redirects]]
  from = "/"
  to = "/.netlify/functions/api/"
  status = 200
  force = true

[[redirects]]
  from = "/add"
  to = "/.netlify/functions/api/add"
  status = 200
  force = true

[[redirects]]
  from = "/user"
  to = "/.netlify/functions/api/user"
  status = 200
  force = true

[[redirects]]
  from = "/new"
  to = "/.netlify/functions/api/new"
  status = 200
  force = true
